<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #121009; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1712; stroke: #3d3020; stroke-width: 1; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="6"/>
  <!-- QR corner squares -->
  <rect x="3" y="3" width="8" height="8" rx="1" fill="#ffb257"/>
  <rect x="5" y="5" width="4" height="4" rx="0.5" fill="#121009"/>
  <rect x="6" y="6" width="2" height="2" fill="#ffb257"/>
  <rect x="21" y="3" width="8" height="8" rx="1" fill="#ffb257"/>
  <rect x="23" y="5" width="4" height="4" rx="0.5" fill="#121009"/>
  <rect x="24" y="6" width="2" height="2" fill="#ffb257"/>
  <rect x="3" y="21" width="8" height="8" rx="1" fill="#ffb257"/>
  <rect x="5" y="23" width="4" height="4" rx="0.5" fill="#121009"/>
  <rect x="6" y="24" width="2" height="2" fill="#ffb257"/>
  <!-- Light beam rays from center -->
  <circle cx="16" cy="16" r="2.5" fill="#ffb257"/>
  <line x1="16" y1="10" x2="16" y2="13" stroke="#ffb257" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="16" y1="19" x2="16" y2="22" stroke="#ffb257" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="10" y1="16" x2="13" y2="16" stroke="#ffb257" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="19" y1="16" x2="22" y2="16" stroke="#ffb257" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- Data dots -->
  <rect x="13" y="3" width="2" height="2" fill="#ffb257" opacity="0.5"/>
  <rect x="17" y="3" width="2" height="2" fill="#ffb257" opacity="0.3"/>
  <rect x="13" y="27" width="2" height="2" fill="#ffb257" opacity="0.4"/>
  <rect x="17" y="27" width="2" height="2" fill="#ffb257" opacity="0.5"/>
  <rect x="27" y="13" width="2" height="2" fill="#ffb257" opacity="0.3"/>
  <rect x="27" y="17" width="2" height="2" fill="#ffb257" opacity="0.5"/>
  <rect x="21" y="21" width="2" height="2" fill="#ffb257" opacity="0.4"/>
  <rect x="24" y="21" width="2" height="2" fill="#ffb257" opacity="0.3"/>
  <rect x="21" y="24" width="2" height="2" fill="#ffb257" opacity="0.5"/>
</svg>
